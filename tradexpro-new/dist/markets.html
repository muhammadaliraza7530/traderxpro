<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeXPro - Markets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/markets.css">
</head>
<body class="dashboard-page markets-screen">
    <main class="dashboard-shell market-app">
        <div class="dashboard-content">
            <header class="topbar flex justify-between items-center w-full px-4 pt-4 pb-2">
                <a class="brand flex items-center gap-2.5" href="/dashboard" aria-label="TradeXPro dashboard">
                    <img class="w-7 h-7 object-contain" src="/static/logo/logo.png" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/logo/logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='/public/logo/logo.png';}" alt="TradeXPro logo">
                    <span class="text-base font-bold text-white tracking-wide">Trade X Pro</span>
                </a>
                <div class="top-actions flex items-center gap-3.5">
                    <a class="icon-button w-5 h-5 text-gray-400 hover:text-white cursor-pointer" href="/support.html" aria-label="Help and support">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-3v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2ZM9 20h5"/><circle cx="12" cy="4" r="1"/></svg>
                    </a>
                    <button class="icon-button notification-button w-5 h-5 text-gray-400 hover:text-white cursor-pointer" type="button" aria-label="Notifications">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                    </button>
                </div>
            </header>
        </div>

        <section class="markets" aria-label="Cryptocurrency markets">
            <div class="px-4 my-3 w-full">
                <div class="relative flex items-center w-full">
                    <svg class="w-4 h-4 absolute left-3.5 text-gray-400 pointer-events-none z-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input id="marketSearch" type="text" placeholder="Search coins" class="w-full bg-[#2B313A]/50 border border-gray-700/40 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-[#F0B90B] transition-all shadow-inner" autocomplete="off" aria-label="Search markets by coin name">
                    <button id="clearMarketSearch" class="market-search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
                </div>
            </div>

            <div id="marketTabs" class="flex items-center gap-6 px-4 border-b border-gray-800/60 overflow-x-auto no-scrollbar" role="tablist" aria-label="Market categories">
                <button data-tab="all" class="market-tab relative py-2.5 text-xs font-bold text-white transition-all" type="button" role="tab" aria-selected="true">
                    All
                    <span class="active-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-[#F0B90B] rounded-full"></span>
                </button>
                <button data-tab="hot" class="market-tab relative py-2.5 text-xs font-medium text-gray-400 hover:text-gray-200 transition-all" type="button" role="tab" aria-selected="false">Hot<span class="active-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-[#F0B90B] rounded-full"></span></button>
                <button data-tab="gainers" class="market-tab relative py-2.5 text-xs font-medium text-gray-400 hover:text-gray-200 transition-all" type="button" role="tab" aria-selected="false">Gainers<span class="active-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-[#F0B90B] rounded-full"></span></button>
                <button data-tab="losers" class="market-tab relative py-2.5 text-xs font-medium text-gray-400 hover:text-gray-200 transition-all" type="button" role="tab" aria-selected="false">Losers<span class="active-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-[#F0B90B] rounded-full"></span></button>
                <button data-tab="new" class="market-tab relative py-2.5 text-xs font-medium text-gray-400 hover:text-gray-200 transition-all" type="button" role="tab" aria-selected="false">New<span class="active-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-[#F0B90B] rounded-full"></span></button>
            </div>

            <div class="market-head flex justify-between mt-2 px-4 py-2 text-[10px] font-semibold text-gray-400 border-b border-gray-800/60 uppercase" aria-hidden="true">
                <div class="w-[38%] text-left">Name</div>
                <div class="w-[32%] text-right pr-2">Last Price</div>
                <div class="w-[30%] text-right">24h Chg%</div>
            </div>

            <div id="market-list" class="market-list" aria-live="polite"></div>
            <div id="market-empty" class="market-empty" hidden>No markets match your search.</div>
        </section>

        <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 bg-[#181A20] border-t border-gray-800 grid grid-cols-5" aria-label="Main navigation">
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/dashboard">
        <svg class="nav-icon-home" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] is-active text-white" href="/markets.html" aria-current="page">
        <svg class="nav-icon-markets" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20V8M22 20V3"/></svg>
        <span>Markets</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/trading/BTC">
        <svg class="nav-icon-trade" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9m0-3V4m8 16v-5m0-3V4m8 16v-2m0-3V4M2 9h4m4 3h4m4 3h4"/></svg>
        <span>Trade</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/staking.html">
        <svg class="nav-icon-staking" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg>
        <span>Staking</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/wallets">
        <svg class="nav-icon-wallet" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 9h20m-5 5h2"/></svg>
        <span>Wallet</span>
    </a>
</nav>
    </main>
    <script src="/static/markets.js" defer></script>
</body>
</html>
