<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeXPro - Deposit Methods</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/deposit-methods.css">
</head>
<body class="dashboard-page deposit-page">
    <main class="dashboard-shell">
        <header class="deposit-header">
            <div class="deposit-title-group">
                <a class="deposit-back" href="/wallets" aria-label="Back to wallet">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </a>
                <h1>Deposit Methods</h1>
            </div>
            <div class="top-actions">
                <a class="icon-button" href="/support.html" aria-label="Help and support">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-3v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2ZM9 20h5"/><circle cx="12" cy="4" r="1"/></svg>
                </a>
                <button class="icon-button notification-button" type="button" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                </button>
            </div>
        </header>

        <section class="deposit-methods" aria-label="Choose a deposit method">
            <button class="deposit-method" type="button" data-method="USDT (TON)" data-currency="USDT" data-checkout="/deposit/checkout/1">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>USDT (TON)</strong><small>Deposit with currency: USDT</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <button class="deposit-method" type="button" data-method="Binance" data-currency="ETH" data-checkout="/deposit/checkout/4">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>Binance</strong><small>Deposit with currency: ETH</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
            <button class="deposit-method" type="button" data-method="Binance" data-currency="USDT" data-checkout="/deposit/checkout/5">
                <svg class="deposit-method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14l1 9H4l1-9Zm7-6v9m-4-5h8m-5 5-5 3m6-3 5 3"/><path d="M3 20h18"/></svg>
                <span class="deposit-method-copy"><strong>Binance</strong><small>Deposit with currency: USDT</small></span>
                <svg class="deposit-method-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
        </section>
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 bg-[#181A20] border-t border-gray-800 grid grid-cols-5" aria-label="Main navigation">
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/dashboard">
        <svg class="nav-icon-home" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/markets.html">
        <svg class="nav-icon-markets" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20V8M22 20V3"/></svg>
        <span>Markets</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/trading/BTC">
        <svg class="nav-icon-trade" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9m0-3V4m8 16v-5m0-3V4m8 16v-2m0-3V4M2 9h4m4 3h4m4 3h4"/></svg>
        <span>Trade</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] text-[#899bb5]" href="/staking.html">
        <svg class="nav-icon-staking" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg>
        <span>Staking</span>
    </a>
    <a class="nav-item flex min-w-0 flex-col items-center justify-center gap-[3px] text-[9px] is-active text-white" href="/wallets" aria-current="page">
        <svg class="nav-icon-wallet" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 9h20m-5 5h2"/></svg>
        <span>Wallet</span>
    </a>
</nav>
    </main>

    <script>
        document.querySelectorAll('[data-method]').forEach((method) => {
            method.addEventListener('click', () => {
                window.location.assign(method.dataset.checkout);
            });
        });
    </script>
</body>
</html>
