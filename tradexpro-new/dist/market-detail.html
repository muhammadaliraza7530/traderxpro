<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202630">
    <title>TradeXPro - BTC/USDT Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/market-detail.css">
</head>
<body class="dashboard-page market-detail-page" data-pair="BTC/USDT" data-symbol="BTCUSDT" data-price="79974.01">
    <main class="dashboard-shell market-detail-shell pb-32">
        <header class="market-detail-header px-4 pt-4 pb-3">
            <button id="market-detail-back" class="detail-icon-button" type="button" aria-label="Back to markets">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="flex min-w-0 items-center gap-2.5">
                <img class="market-detail-logo" src="https://assets.coincap.io/assets/icons/btcusdt@2x.png" alt="BTCUSDT logo" onerror="this.style.display='none'">
                <div class="min-w-0">
                    <h1 id="pairTitle" class="market-detail-pair truncate text-sm font-bold text-white">BTC/USDT</h1>
                    <p class="text-[10px] text-gray-500">Spot market</p>
                </div>
            </div>
            <button id="market-detail-favorite" class="detail-icon-button" type="button" aria-label="Add to favorites" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 2.8Z"/></svg>
            </button>
        </header>

        <section class="market-summary px-4 pb-4">
            <div class="flex items-end justify-between gap-4">
                <div>
                    <p class="mb-1 text-[10px] font-medium uppercase tracking-[0.14em] text-gray-500">Last price</p>
                    <p id="currentPrice" class="text-2xl font-bold tracking-tight text-white">$79974.01</p>
                </div>
                <div id="priceChange" class="rounded-lg border border-[#0ECB81]/20 bg-[#0ECB81]/10 px-2.5 py-1.5 text-xs font-bold text-[#0ECB81]">--</div>
            </div>

            <div class="mt-4 grid grid-cols-3 gap-2 border-t border-gray-800/80 pt-4">
                <div>
                    <p class="text-[9px] uppercase tracking-wide text-gray-500">24h High</p>
                    <p id="highPrice" class="mt-1 text-[11px] font-semibold text-gray-200">--</p>
                </div>
                <div>
                    <p class="text-[9px] uppercase tracking-wide text-gray-500">24h Low</p>
                    <p id="lowPrice" class="mt-1 text-[11px] font-semibold text-gray-200">--</p>
                </div>
                <div>
                    <p class="text-[9px] uppercase tracking-wide text-gray-500">24h Volume</p>
                    <p id="vol24h" class="mt-1 text-[11px] font-semibold text-gray-200">--</p>
                </div>
            </div>
        </section>

        <section class="chart-section">
            <div class="chart-toolbar flex items-center justify-between px-4 py-2 text-xs border-b border-gray-800/40">
                <div id="market-timeframes" class="timeframe-selector" role="tablist" aria-label="Chart timeframe">
                    <button class="timeframe-pill is-active" type="button" role="tab" aria-selected="true" data-timeframe="Time">Time</button>
                    <button class="timeframe-pill" type="button" role="tab" aria-selected="false" data-timeframe="15m">15m</button>
                    <button class="timeframe-pill" type="button" role="tab" aria-selected="false" data-timeframe="1h">1h</button>
                    <button class="timeframe-pill" type="button" role="tab" aria-selected="false" data-timeframe="4h">4h</button>
                    <button class="timeframe-pill" type="button" role="tab" aria-selected="false" data-timeframe="1d">1D</button>
                    <button class="timeframe-pill" type="button" role="tab" aria-selected="false" data-timeframe="1w">More ▼</button>
                </div>
                <div class="chart-toolbar-actions flex items-center gap-1" aria-label="Chart controls">
                    <button class="chart-control" type="button" aria-label="Depth chart" title="Depth chart">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9m5 9V6m5 12v-7m5 7V4"/></svg>
                    </button>
                    <button class="chart-control" type="button" aria-label="Chart settings" title="Chart settings">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.19 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.19H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .19-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.15.36.38.7.6 1 .24.3.58.48.95.5H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
                    </button>
                    <button id="chartFullscreenButton" class="chart-control" type="button" aria-label="Expand chart" title="Expand chart">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
                    </button>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-card-body">
                    <div id="market-chart" class="market-chart" role="img" aria-label="Candlestick chart for BTC/USDT">
                        <div id="chartLegend" class="chart-legend-line">
                            <span class="chart-legend-label">MA60 <strong id="ma60Value">--</strong></span>
                            <span class="chart-status"><i id="statusDot" aria-hidden="true"></i><span id="chartStatus">Loading history</span></span>
                        </div>
                        <canvas id="priceChartCanvas"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <nav class="market-action-bar" aria-label="Market actions">
            <button id="market-buy" class="market-action market-action-buy" type="button">
                <span class="text-xs font-bold">Buy / Long</span>
                <span class="text-[9px] font-medium opacity-80">Market order</span>
            </button>
            <button id="market-sell" class="market-action market-action-sell" type="button">
                <span class="text-xs font-bold">Sell / Short</span>
                <span class="text-[9px] font-medium opacity-80">Market order</span>
            </button>
        </nav>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#181A20] border-t border-gray-800/60 flex justify-around items-center py-2 z-50" aria-label="Main navigation">
        <a href="/home" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px]">
            <i data-lucide="home" class="w-5 h-5 mb-1"></i>
            <span>Home</span>
        </a>
        <a href="/markets" class="flex flex-col items-center text-[#F0B90B] font-medium text-[10px]">
            <i data-lucide="bar-chart-2" class="w-5 h-5 mb-1 text-[#F0B90B]"></i>
            <span>Markets</span>
        </a>
        <a href="/trade" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px]">
            <i data-lucide="sliders" class="w-5 h-5 mb-1"></i>
            <span>Trade</span>
        </a>
        <a href="/staking" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px]">
            <i data-lucide="layers" class="w-5 h-5 mb-1"></i>
            <span>Staking</span>
        </a>
        <a href="/wallet" class="flex flex-col items-center text-gray-400 hover:text-white text-[10px]">
            <i data-lucide="wallet" class="w-5 h-5 mb-1"></i>
            <span>Wallet</span>
        </a>
    </nav>

    <div id="market-action-toast" class="market-action-toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/market-detail.js" defer></script>
    <script>lucide.createIcons();</script>
</body>
</html>
