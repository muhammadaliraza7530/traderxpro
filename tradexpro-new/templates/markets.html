<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeXPro - Markets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='markets.css') }}">
</head>
<body class="dashboard-page markets-screen">
    <main class="dashboard-shell market-app">
        <div class="dashboard-content">
            <header class="topbar flex justify-between items-center w-full px-4 pt-4 pb-2">
                <a class="brand flex items-center gap-2.5" href="{{ url_for('dashboard') }}" aria-label="TradeXPro dashboard">
                    <img class="w-7 h-7 object-contain" src="{{ url_for('static', filename='logo/logo.png') }}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/logo/logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='/public/logo/logo.png';}" alt="TradeXPro logo">
                    <span class="text-base font-bold text-white tracking-wide">Trade X Pro</span>
                </a>
                <div class="top-actions flex items-center gap-3.5">
                    <a class="icon-button w-5 h-5 text-gray-400 hover:text-white cursor-pointer" href="{{ url_for('help_support') }}" aria-label="Help and support">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-3v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2ZM9 20h5"/><circle cx="12" cy="4" r="1"/></svg>
                    </a>
                    <button class="icon-button notification-button w-5 h-5 text-gray-400 hover:text-white cursor-pointer" type="button" aria-label="Notifications">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                    </button>
                </div>
            </header>
        </div>

        <section class="markets" aria-label="Cryptocurrency markets">
            <div class="px-4 my-3 w-full">
                <div class="relative flex items-center w-full">
                    <svg class="w-4 h-4 absolute left-3.5 text-gray-400 pointer-events-none z-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input id="marketSearch" type="text" placeholder="Search coins" class="w-full bg-[#2B313A]/50 border border-gray-700/40 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-[#F0B90B] transition-all shadow-inner" autocomplete="off" aria-label="Search markets by coin name">
                    <button id="clearMarketSearch" class="market-search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
                </div>
            </div>

            <div class="tabs-container" id="marketCategoryTabs" aria-label="Market navigation">
                <div class="tabs-row tabs-row-main" role="tablist" aria-label="Market categories">
                    <button class="market-category-tab is-active" data-category="favorites" type="button" role="tab" aria-selected="true">Favorites ★</button>
                    <button class="market-category-tab" data-category="crypto" type="button" role="tab" aria-selected="false">Crypto</button>
                    <button class="market-category-tab" data-category="prediction" type="button" role="tab" aria-selected="false">Prediction Pairs</button>
                    <button class="market-category-tab" data-category="gainers" type="button" role="tab" aria-selected="false">Top Gainers</button>
                    <button class="market-category-tab" data-category="losers" type="button" role="tab" aria-selected="false">Top Losers</button>
                    <span class="tab-underline" aria-hidden="true"></span>
                </div>
                <div class="tabs-row tabs-row-secondary" role="tablist" aria-label="Market products">
                    <button class="sub-tab active active-sub" data-sub-category="spot" data-tab="spot" type="button" role="tab" aria-selected="true">Spot</button>
                    <button class="sub-tab" data-sub-category="usdsm" data-tab="usdm" type="button" role="tab" aria-selected="false">USDⓈ-M</button>
                    <button class="sub-tab" data-sub-category="coinm" type="button" role="tab" aria-selected="false">COIN-M</button>
                    <button class="sub-tab" data-sub-category="options" type="button" role="tab" aria-selected="false">Options</button>
                </div>
                <div class="tabs-row tabs-row-tertiary" role="tablist" aria-label="Market themes">
                    <button class="sub-tab active-sub" data-sub-category="ai" type="button" role="tab" aria-selected="true">AI</button>
                    <button class="sub-tab" data-sub-category="meme" type="button" role="tab" aria-selected="false">MEME</button>
                    <button class="sub-tab" data-sub-category="monitoring" type="button" role="tab" aria-selected="false">Monitoring</button>
                    <button class="sub-tab" data-sub-category="seed" type="button" role="tab" aria-selected="false">Seed</button>
                    <button class="sub-tab" data-sub-category="defi" type="button" role="tab" aria-selected="false">DeFi</button>
                    <button class="sub-tab" data-sub-category="usdt" type="button" role="tab" aria-selected="false">USDT ▾</button>
                </div>
            </div>

            <div class="market-product-content">
                <!-- Keep the existing Spot market list available as its own view. -->
                <section id="spotMarketContent" class="market-view" aria-label="Spot markets">
                    <div class="market-head flex justify-between mt-2 px-4 py-2 text-[10px] font-semibold text-gray-400 border-b border-gray-800/60 uppercase" aria-hidden="true">
                        <div class="w-[38%] text-left">Name</div>
                        <div class="w-[32%] text-right pr-2">Last Price</div>
                        <div class="w-[30%] text-right">24h Chg%</div>
                    </div>
                    <div id="market-list" class="market-list" aria-live="polite"></div>
                    <div id="market-empty" class="market-empty" hidden>No markets match your search.</div>
                </section>

                <!-- USDⓈ-M rows are rendered here by markets.js when selected. -->
                <section id="usdsmMarketContent" class="market-view futures-market-view" aria-label="USDⓈ-M perpetual futures" hidden>
                    <div class="futures-filter-row" role="tablist" aria-label="Futures asset categories">
                        <button class="futures-filter is-active" data-futures-filter="all" type="button" role="tab" aria-selected="true">All</button>
                        <button class="futures-filter" data-futures-filter="New" type="button" role="tab" aria-selected="false">New</button>
                        <button class="futures-filter" data-futures-filter="Crypto" type="button" role="tab" aria-selected="false">Crypto</button>
                        <button class="futures-filter" data-futures-filter="DeFi" type="button" role="tab" aria-selected="false">DeFi</button>
                        <button class="futures-filter" data-futures-filter="Metaverse" type="button" role="tab" aria-selected="false">Metaverse</button>
                        <button class="futures-filter" data-futures-filter="Pay" type="button" role="tab" aria-selected="false">Pay</button>
                    </div>
                    <div class="futures-market-head" role="row">
                        <span aria-hidden="true"></span>
                        <button type="button" data-futures-sort="name">NAME ⇅</button>
                        <button type="button" data-futures-sort="price">LAST PRICE ⇅</button>
                        <button type="button" data-futures-sort="change">24H CHG% ⇅</button>
                    </div>
                    <div id="futures-market-list" class="futures-market-list" aria-live="polite"></div>
                    <div id="futures-market-empty" class="market-empty" role="status" hidden>No perpetual pairs match this filter.</div>
                </section>
            </div>
        </section>

        {% include "_bottom-nav.html" %}
    </main>
    <script src="{{ url_for('static', filename='markets.js') }}" defer></script>
</body>
</html>
